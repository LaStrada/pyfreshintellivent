name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Require a commit merged into main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - name: Check release metadata
        run: poetry run python .github/scripts/check-release.py

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/pyfreshintellivent
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
