name: CI

# Follow the Airthings BLE convention: verified stable major action tags.
# Dependabot proposes future major updates; do not replace tags with commit SHAs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    name: Run tests for ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install poetry==2.5.1
      - run: poetry check --lock
      - run: poetry install --no-interaction
      - run: poetry run pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  platforms:
    name: Run tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run pytest

  lint:
    # Preserve the existing required branch-protection check name.
    name: Lint code for 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run black --check pyfreshintellivent tests
      - run: poetry run isort --check-only pyfreshintellivent tests
      - run: poetry run ruff check pyfreshintellivent tests
      - run: poetry run pylint pyfreshintellivent
      - run: poetry run mypy pyfreshintellivent

  package:
    name: Build and smoke-test wheel
    needs: [test, platforms, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install poetry==2.5.1
      - run: poetry build
      - name: Verify installed wheel outside source tree
        run: |
          python -m venv /tmp/fresh-wheel
          /tmp/fresh-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/fresh-wheel/bin/python -c 'from importlib.resources import files; import pyfreshintellivent; assert files("pyfreshintellivent").joinpath("py.typed").is_file()'
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  repository:
    name: Check contribution automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test .github/tests/pr-labels.test.cjs
