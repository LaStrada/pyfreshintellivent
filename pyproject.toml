[project]
name = "pyfreshintellivent"
version = "1.0.0rc2"
description = "Modern, type-safe Python interface for Fresh Intellivent Sky bathroom ventilation fan"
authors = [
    {name = "Ståle Storø Hauknes", email = "walnut-caprice.04@icloud.com"},
]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["ble", "bluetooth", "ventilation", "fresh", "intellivent", "sky", "home-automation"]
requires-python = ">=3.12,<4"
dependencies = [
    "bleak (>=3.0.2)",
    "bleak-retry-connector (>=4.7.1)",
    "async-interrupt>=1.2.2",
]

[project.urls]
repository = "https://github.com/LaStrada/pyfreshintellivent"

[tool.poetry]
include = ["characteristics.md"]

[tool.poetry.group.dev.dependencies]
black = ">=26.10.1"
isort = "^7.0.0"
ruff = ">=0.14.3"
mypy = "^1.18.2"
pylint = "^4.1.3"

[tool.poetry.group.test.dependencies]
packaging = ">=25.0"
pytest = "^9.1.1"
pytest-asyncio = "^1.2.0"
pytest-cov = "^7.0.0"
pytest-rerunfailures = "^16.7.0"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-v -Wdefault --cov=pyfreshintellivent --cov-report=term-missing:skip-covered"
pythonpath = ["pyfreshintellivent"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# 100% aggregate statement/branch coverage also exceeds a 95% per-file floor.
fail_under = 100
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    "tests/.*",
    "examples/.*",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs", "build"]
src = ["pyfreshintellivent", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "x", "y"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
